<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalk Web</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Chalk</h1>
    <p id="platform" class="muted"></p>
    <div class="layout">
        <div class="padwrap"><canvas id="pad" width="800" height="800"></canvas><div id="hint">Draw something here</div></div>
        <section class="card">
            <div class="label">Chalk thinks it's</div>
            <div id="bars"></div>
            <p id="timing" class="muted small"></p>
        </section>
    </div>
    <div id="examples" class="row"></div>
    <p class="muted small">345 things · runs on this device · no network, no permission</p>
    <p id="load" class="muted small"></p>
</main>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
